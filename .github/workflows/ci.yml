name: CI/CD

# runs on every push and pull request on the main branches
# PRs from forks also go through CI, but the docker job does not run (no access to secrets)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  # github.repository resolves to "user/ecoshop" — used as the image name in the registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. CI
  # validates that the code compiles and passes lint before anything else
  # runs on every PR to give quick feedback before the merge
  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Real services for the integration tests (Constitution, Art. II).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecoshop
          POSTGRES_PASSWORD: ecoshop
          POSTGRES_DB: ecoshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecoshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ecoshop:ecoshop@localhost:5432/ecoshop_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-with-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same version as the Dockerfile and .nvmrc (Constitution, Art. XII.3)
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma Client
        # the prisma client must exist so tsc and next build can resolve the imports
        run: npx prisma generate

      - name: Lint
        # ESLint 9 (flat config); `next lint` is deprecated (ADR-0015).
        # The warning ceiling can only GO DOWN: when fixing warnings, lower the number;
        # novo aviso quebra o CI. Meta: 0 (REQ-OPS-20).
        run: npx eslint . --max-warnings 16

      - name: Production dependency audit
        # REQ-OPS-20. On 2026-11-11 the audit found 15 vulnerabilities (1 critical in
        # `next`, 11 high), almost all with a non-breaking fix, but the update
        # changes many dependencies and has not yet been validated with the full suite.
        # Por isso NÃO bloqueia por enquanto (continue-on-error). Depois de atualizar,
        # remove the `continue-on-error` line so the gate takes effect.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm test

      - name: SDD checks (specs, traceability, ADRs)
        # spec-lint + trace-check + adr-index: the spec is partly executable (Art. XVI)
        run: npm run sdd:check

      - name: Impact on capabilities and ADRs (fails if a sensitive path changed without citing the ADR in the PR)
        if: github.event_name == 'pull_request'
        run: node scripts/sdd/impact-map.mjs --base origin/${{ github.base_ref }} --require-adr >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          GEMINI_KEY: ci-placeholder
          AZURE_VISION_ENDPOINT: https://placeholder.cognitiveservices.azure.com/
          AZURE_VISION_KEY: ci-placeholder

      - name: Server refuses to start with an invalid JWT_SECRET (REQ-OPS-06)
        # usa o servidor standalone gerado pelo build acima
        run: node scripts/ops/check-boot.mjs

      - name: Compose requires the secrets and is valid (REQ-OPS-07/08/11)
        # throwaway values, only to validate the syntax; without them the validation must FAIL
        env:
          VARS: >-
            JWT_SECRET=x7Qm2LbR9vTn4KcE8wYpZa3JdHfUg6Nz
            POSTGRES_PASSWORD=pgci123 REDIS_PASSWORD=rdci123
            ADMIN_PASSWORD=AdminDeTeste-123 SEED_USER_PASSWORD=SeedDeTeste-123
            ECOSHOP_IMAGE=ghcr.io/exemplo/ecoshop APP_TAG=sha-0000000
            NEXT_PUBLIC_SITE_URL=https://exemplo.test
        run: |
          set -eu
          EMPTY="$(mktemp)"
          for files in "" "-f docker-compose.yml" "-f docker-compose.prod.yml"; do
            # with the variables: valid
            env -i PATH="$PATH" HOME="$HOME" $VARS docker compose --env-file "$EMPTY" $files config -q
            # without the variables: must fail
            if env -i PATH="$PATH" HOME="$HOME" docker compose --env-file "$EMPTY" $files config -q 2>/dev/null; then
              echo "::error::compose ${files:-base+override} started without the required secrets"
              exit 1
            fi
          done

  # --- 2. build & push the docker image
  # only runs on push — PRs do not publish an image because they may come from forks without access to secrets
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'

    outputs:
      tag: ${{ steps.tag.outputs.value }}
      image: ${{ steps.tag.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        # buildx enables multi-platform builds and the github actions cache (type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is generated automatically by actions — no secret needs to be configured
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define the image tag and name
        id: tag
        # the tag is computed ONCE here and passed on to the deploy job (REQ-OPS-10/11);
        # the image name must be lowercase for ghcr.io
        run: |
          echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.image }}
          tags: |
            # sha-<commit> lets you trace exactly which commit produced each image
            type=raw,value=${{ steps.tag.outputs.value }}
            # the latest tag is only updated on pushes to main, never on develop
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push (application)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from/to reuses the layers of the previous build stored in the github actions cache
          # significantly reduces build time when only the app code changes
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (migrations)
        # the "runner" target has no Prisma CLI; the deploy applies the migrations with this image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.value }}-migrator
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  # --- 3. CD — deploy no vps via ssh
  # only runs on push to main — develop does not deploy to production automatically
  # depends on the docker job to ensure the image has already been published to the registry
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # environment: production enables extra protections on github (e.g. manual approval)
    # and shows the environment url in the actions interface
    # APP_URL must be configured in: Settings → Environments → production → Variables
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TAG: ${{ needs.docker.outputs.tag }}
      IMAGE: ${{ needs.docker.outputs.image }}

    steps:
      - name: Checkout (deploy files)
        uses: actions/checkout@v7

      - name: Configure SSH
        # native ssh/scp from the runner, with no third-party action in the delivery chain (REQ-OPS-10).
        # SSH_KNOWN_HOSTS (output of `ssh-keyscan <host>` checked by a person) allows
        # verifying the server key; without it the deploy fails instead of trusting any host.
        # The public key matching SSH_PRIVATE_KEY must be in the server's authorized_keys.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the compose file and deploy script
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            docker-compose.prod.yml scripts/deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:/opt/ecoshop/"

      - name: Deploy (migrates, starts, checks health and rolls back on failure)
        # the .env with the secrets lives only on the server (/opt/ecoshop/.env), outside the repository
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/ecoshop && ECOSHOP_IMAGE='$IMAGE' APP_TAG='$TAG' sh ./deploy.sh"
