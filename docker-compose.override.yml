# =============================================================================
# DOCKER COMPOSE - SOMENTE DESENVOLVIMENTO
# =============================================================================
# O Docker Compose carrega este arquivo sozinho junto com docker-compose.yml
# quando se roda `docker compose up` SEM -f. Em servidor, use
# `docker compose -f docker-compose.prod.yml ...`: este arquivo não entra.
#
# O que ele acrescenta (REQ-OPS-08/09):
# - portas do Postgres e do Redis publicadas apenas em 127.0.0.1, para depurar
#   e para `npm run dev` fora do Docker;
# - seed de demonstração (usuários, marcas, produtos) com SEED_USER_PASSWORD.
#
# Variável obrigatória adicional: SEED_USER_PASSWORD (12+ caracteres).
# =============================================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  seed-demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ecoshop-seed-demo
    environment:
      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/ecoshop
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:?defina SEED_USER_PASSWORD no .env (12+ caracteres)}
    command: npx tsx prisma/seed.ts
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: "no"

  app:
    depends_on:
      seed-demo:
        condition: service_completed_successfully
