# =============================================================================
# DOCKER COMPOSE - ECOSHOP (base e desenvolvimento)
# =============================================================================
# Serviços:
# - app: aplicação Next.js (build local)
# - postgres: banco de dados PostgreSQL
# - redis: cache e rate limiting (com senha)
# - migrate: job único de migrations (executa antes do app)
# - seed: job único que cria o ADMIN (prisma/seed-admin.ts), após o migrate
#
# Em desenvolvimento o Docker Compose também carrega, sozinho,
# docker-compose.override.yml: ele publica as portas do banco e do Redis em
# 127.0.0.1 e acrescenta o seed de demonstração (REQ-OPS-08/09).
# Para publicar em servidor use docker-compose.prod.yml (REQ-OPS-11).
#
# Como usar:
#   cp .env.example .env     # e preencha as variáveis obrigatórias
#   docker compose up --build
#
# Variáveis OBRIGATÓRIAS (a subida falha nomeando a que faltar; REQ-OPS-07):
#   JWT_SECRET         32+ caracteres aleatórios, sem valor-exemplo
#   POSTGRES_PASSWORD  senha do banco (use só letras e números: vai dentro de uma URL)
#   REDIS_PASSWORD     senha do Redis (idem)
#   ADMIN_PASSWORD     senha do ADMIN criado pelo seed (12+ caracteres)
# Opcionais: ADMIN_EMAIL, ADMIN_NAME, GEMINI_KEY, AZURE_VISION_*, AI_CONFIDENCE_THRESHOLD
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SERVIÇO: APLICAÇÃO NEXT.JS
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner # Usa o estágio runner (produção)
    container_name: ecoshop-app
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"

      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/ecoshop
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379

      # Em produção a aplicação recusa iniciar sem um segredo forte (REQ-OPS-06).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (32+ caracteres aleatórios)}

      GEMINI_KEY: ${GEMINI_KEY}

      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY}

      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.7}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - fotos_data:/app/public/data_fotos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # SERVIÇO: POSTGRESQL (sem porta publicada no host; ver o override de dev)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: ecoshop-postgres
    environment:
      POSTGRES_USER: ecoshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ecoshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SERVIÇO: REDIS (com senha; sem porta publicada no host)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: ecoshop-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    environment:
      # O redis-cli lê a senha desta variável (evita a senha na linha de comando).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # JOB: MIGRATIONS
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ecoshop-migrate
    environment:
      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/ecoshop
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # JOB: CRIA O ADMIN (REQ-OPS-02/09)
  # Sem senha embutida: ADMIN_PASSWORD é obrigatória. Este seed cria ou ATUALIZA
  # o ADMIN de ADMIN_EMAIL, redefinindo a senha para o valor do .env a cada subida.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator # Reutiliza o estágio migrator (tem tsx e prisma)
    container_name: ecoshop-seed
    environment:
      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/ecoshop
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecoshop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env (12+ caracteres)}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador EcoShop}
    command: npx tsx prisma/seed-admin.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  fotos_data:
