name: CI/CD

# roda em todo push e pull request nas branches principais
# PRs de forks também passam pelo CI, mas o job de docker não roda (sem acesso a secrets)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  # github.repository resolve para "usuario/ecoshop" — usado como nome da imagem no registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. CI
  # valida que o código compila e passa no lint antes de qualquer coisa
  # roda em todo PR para dar feedback rápido antes do merge
  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Serviços reais para os testes de integração (Constitution, Art. II).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecoshop
          POSTGRES_PASSWORD: ecoshop
          POSTGRES_DB: ecoshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecoshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ecoshop:ecoshop@localhost:5432/ecoshop_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-with-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Mesma versão do Dockerfile e do .nvmrc (Constitution, Art. XII.3)
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma Client
        # o prisma client precisa existir para o tsc e o next build resolverem os imports
        run: npx prisma generate

      - name: Lint
        # ESLint 9 (flat config); `next lint` está depreciado (ADR-0015)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm test

      - name: SDD checks (specs, rastreabilidade, ADRs)
        # spec-lint + trace-check + adr-index: a spec é executável em parte (Art. XVI)
        run: npm run sdd:check

      - name: Impacto em capacidades e ADRs (falha se caminho sensível mudou sem citar o ADR no PR)
        if: github.event_name == 'pull_request'
        run: node scripts/sdd/impact-map.mjs --base origin/${{ github.base_ref }} --exige-adr >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          GEMINI_KEY: ci-placeholder
          AZURE_VISION_ENDPOINT: https://placeholder.cognitiveservices.azure.com/
          AZURE_VISION_KEY: ci-placeholder

  # --- 2. build & push da imagem docker
  # só roda em push — PRs não publicam imagem porque podem vir de forks sem acesso a secrets
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # buildx habilita builds multi-plataforma e o cache do github actions (type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN é gerado automaticamente pelo actions — não precisa configurar nenhum secret
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # sha-<commit> permite rastrear exatamente qual commit gerou cada imagem
            type=sha,prefix=sha-
            # tag latest só é atualizada em pushes na main, nunca em develop
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from/to reutiliza as camadas do build anterior armazenadas no github actions cache
          # reduz o tempo de build significativamente quando só o código da app muda
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- 3. CD — deploy no vps via ssh
  # só executa em push na main — develop não deploya para produção automaticamente
  # depende do job docker para garantir que a imagem já foi publicada no registry
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # environment: production habilita proteções extras no github (ex: aprovação manual)
    # e exibe a url do ambiente na interface do actions
    # APP_URL deve ser configurado em: Settings → Environments → production → Variables
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    steps:
      - name: Deploy via SSH
        # SHA fixo para segurança de supply chain — evita que uma tag flutuante (@v1)
        # possa ser redirecionada para um commit malicioso sem aviso
        uses: appleboy/ssh-action@1d1b21ca96111b1542fcbb83791f2dca5dfaa3d8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # chave privada SSH cadastrada nos secrets do repositório
          # a chave pública correspondente precisa estar no ~/.ssh/authorized_keys do servidor
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/ecoshop

            # puxa apenas a imagem da app — postgres e redis continuam rodando sem interrupção
            docker compose pull app

            # --no-deps recria só o container da app sem reiniciar postgres e redis
            # -d sobe em background e libera o terminal do ssh
            docker compose up -d --no-deps app

            # aplica APENAS as migrations pendentes — nunca roda o seed em produção via CI
            # o seed é executado uma única vez na criação do ambiente (docker compose up inicial)
            # rodá-lo a cada deploy causaria dados duplicados ou erros de constraint
            docker compose run --rm migrate sh -c "npx prisma migrate deploy"

            # remove imagens antigas que não são mais referenciadas por nenhum container
            # sem isso, cada deploy deixa uma imagem "dangling" acumulando espaço em disco
            docker image prune -f
