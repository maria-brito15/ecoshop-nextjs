# Automatic updates of the base images (pinned by digest) and of the actions (REQ-OPS-13).
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # minor and patch updates arrive grouped, to reduce noise
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
