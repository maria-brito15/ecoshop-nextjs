name: SDD drift (monthly)

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Stale specs report
        id: report
        run: |
          {
            echo "## Validations"
            node scripts/sdd/spec-lint.mjs || true
            node scripts/sdd/adr-index.mjs --check || true
            echo
            echo "## Traceability and stale items"
            node scripts/sdd/trace-check.mjs --stale || true
          } > drift.md 2>&1
          cat drift.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "SDD: monthly drift review ($(date +%Y-%m))" \
            --body-file drift.md
