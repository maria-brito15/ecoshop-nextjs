# =============================================================================
# DOCKER COMPOSE - ECOSHOP (base and development)
# =============================================================================
# Services:
# - app: Next.js application (local build)
# - postgres: PostgreSQL database
# - redis: cache and rate limiting (with a password)
# - migrate: one-off migrations job (runs before the app)
# - seed: one-off job that creates the ADMIN (prisma/seed-admin.ts), after migrate
#
# In development Docker Compose also loads, on its own,
# docker-compose.override.yml: it publishes the database and Redis ports on
# 127.0.0.1 and adds the demo seed (REQ-OPS-08/09).
# To publish on a server use docker-compose.prod.yml (REQ-OPS-11).
#
# How to use:
#   cp .env.example .env     # and fill in the required variables
#   docker compose up --build
#
# REQUIRED variables (startup fails naming the missing one; REQ-OPS-07):
#   JWT_SECRET         32+ random characters, no example value
#   POSTGRES_PASSWORD  database password (use only letters and numbers: it goes inside a URL)
#   REDIS_PASSWORD     Redis password (same)
#   ADMIN_PASSWORD     password of the ADMIN created by the seed (12+ characters)
# Optional: ADMIN_EMAIL, ADMIN_NAME, GEMINI_KEY, AZURE_VISION_*, AI_CONFIDENCE_THRESHOLD
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SERVICE: NEXT.JS APPLICATION
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner # Uses the runner stage (production)
    container_name: ecoshop-app
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"

      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ecoshop
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379

      # In production the application refuses to start without a strong secret (REQ-OPS-06).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}

      GEMINI_KEY: ${GEMINI_KEY}

      AZURE_VISION_ENDPOINT: ${AZURE_VISION_ENDPOINT}
      AZURE_VISION_KEY: ${AZURE_VISION_KEY}

      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.7}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - photos_data:/app/public/data_photos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # SERVICE: POSTGRESQL (no port published on the host; see the dev override)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: ecoshop-postgres
    environment:
      POSTGRES_USER: ecoshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ecoshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SERVICE: REDIS (with a password; no port published on the host)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    container_name: ecoshop-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # redis-cli reads the password from this variable (keeps it off the command line).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # JOB: MIGRATIONS
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ecoshop-migrate
    environment:
      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ecoshop
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # JOB: CREATES THE ADMIN (REQ-OPS-02/09)
  # No embedded password: ADMIN_PASSWORD is required. This seed creates or UPDATES
  # the ADMIN of ADMIN_EMAIL, resetting the password to the .env value on every start.
  # ---------------------------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator # Reuses the migrator stage (has tsx and prisma)
    container_name: ecoshop-seed
    environment:
      DATABASE_URL: postgresql://ecoshop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ecoshop
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecoshop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (12+ characters)}
      ADMIN_NAME: ${ADMIN_NAME:-EcoShop Administrator}
    command: npx tsx prisma/seed-admin.ts
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  photos_data:
