name: CI/CD

# roda em todo push e pull request nas branches principais
# PRs de forks também passam pelo CI, mas o job de docker não roda (sem acesso a secrets)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  # github.repository resolve para "usuario/ecoshop" — usado como nome da imagem no registry
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # --- 1. CI
  # valida que o código compila e passa no lint antes de qualquer coisa
  # roda em todo PR para dar feedback rápido antes do merge
  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    # Serviços reais para os testes de integração (Constitution, Art. II).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecoshop
          POSTGRES_PASSWORD: ecoshop
          POSTGRES_DB: ecoshop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecoshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ecoshop:ecoshop@localhost:5432/ecoshop_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-with-at-least-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Mesma versão do Dockerfile e do .nvmrc (Constitution, Art. XII.3)
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Generate Prisma Client
        # o prisma client precisa existir para o tsc e o next build resolverem os imports
        run: npx prisma generate

      - name: Lint
        # ESLint 9 (flat config); `next lint` está depreciado (ADR-0015).
        # O teto de avisos só pode DESCER: ao corrigir avisos, reduza o número;
        # novo aviso quebra o CI. Meta: 0 (REQ-OPS-20).
        run: npx eslint . --max-warnings 16

      - name: Auditoria de dependências de produção
        # REQ-OPS-20. Em 2026-11-11 a auditoria achou 15 vulnerabilidades (1 crítica em
        # `next`, 11 altas), quase todas com correção sem quebra, mas a atualização
        # troca muitas dependências e ainda não foi validada com a suíte completa.
        # Por isso NÃO bloqueia por enquanto (continue-on-error). Depois de atualizar,
        # remova a linha `continue-on-error` para o gate passar a valer.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations (test database)
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm test

      - name: SDD checks (specs, rastreabilidade, ADRs)
        # spec-lint + trace-check + adr-index: a spec é executável em parte (Art. XVI)
        run: npm run sdd:check

      - name: Impacto em capacidades e ADRs (falha se caminho sensível mudou sem citar o ADR no PR)
        if: github.event_name == 'pull_request'
        run: node scripts/sdd/impact-map.mjs --base origin/${{ github.base_ref }} --exige-adr >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build
        env:
          GEMINI_KEY: ci-placeholder
          AZURE_VISION_ENDPOINT: https://placeholder.cognitiveservices.azure.com/
          AZURE_VISION_KEY: ci-placeholder

      - name: Servidor recusa iniciar com JWT_SECRET inválido (REQ-OPS-06)
        # usa o servidor standalone gerado pelo build acima
        run: node scripts/ops/checar-boot.mjs

      - name: Compose exige os segredos e é válido (REQ-OPS-07/08/11)
        # valores descartáveis, só para validar a sintaxe; sem eles a validação deve FALHAR
        env:
          VARIAVEIS: >-
            JWT_SECRET=x7Qm2LbR9vTn4KcE8wYpZa3JdHfUg6Nz
            POSTGRES_PASSWORD=pgci123 REDIS_PASSWORD=rdci123
            ADMIN_PASSWORD=AdminDeTeste-123 SEED_USER_PASSWORD=SeedDeTeste-123
            ECOSHOP_IMAGE=ghcr.io/exemplo/ecoshop APP_TAG=sha-0000000
            NEXT_PUBLIC_SITE_URL=https://exemplo.test
        run: |
          set -eu
          VAZIO="$(mktemp)"
          for arquivos in "" "-f docker-compose.yml" "-f docker-compose.prod.yml"; do
            # com as variáveis: válido
            env -i PATH="$PATH" HOME="$HOME" $VARIAVEIS docker compose --env-file "$VAZIO" $arquivos config -q
            # sem as variáveis: deve falhar
            if env -i PATH="$PATH" HOME="$HOME" docker compose --env-file "$VAZIO" $arquivos config -q 2>/dev/null; then
              echo "::error::compose ${arquivos:-base+override} subiu sem os segredos obrigatórios"
              exit 1
            fi
          done

  # --- 2. build & push da imagem docker
  # só roda em push — PRs não publicam imagem porque podem vir de forks sem acesso a secrets
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'

    outputs:
      tag: ${{ steps.tag.outputs.valor }}
      imagem: ${{ steps.tag.outputs.imagem }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # buildx habilita builds multi-plataforma e o cache do github actions (type=gha)
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN é gerado automaticamente pelo actions — não precisa configurar nenhum secret
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag e nome da imagem
        id: tag
        # a tag é calculada UMA vez aqui e repassada ao job de deploy (REQ-OPS-10/11);
        # o nome da imagem precisa estar em minúsculas para o ghcr.io
        run: |
          echo "valor=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "imagem=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tag.outputs.imagem }}
          tags: |
            # sha-<commit> permite rastrear exatamente qual commit gerou cada imagem
            type=raw,value=${{ steps.tag.outputs.valor }}
            # tag latest só é atualizada em pushes na main, nunca em develop
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push (aplicação)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from/to reutiliza as camadas do build anterior armazenadas no github actions cache
          # reduz o tempo de build significativamente quando só o código da app muda
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push (migrations)
        # o alvo "runner" não tem o CLI do Prisma; o deploy aplica as migrations com esta imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.tag.outputs.imagem }}:${{ steps.tag.outputs.valor }}-migrator
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  # --- 3. CD — deploy no vps via ssh
  # só executa em push na main — develop não deploya para produção automaticamente
  # depende do job docker para garantir que a imagem já foi publicada no registry
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # environment: production habilita proteções extras no github (ex: aprovação manual)
    # e exibe a url do ambiente na interface do actions
    # APP_URL deve ser configurado em: Settings → Environments → production → Variables
    environment:
      name: production
      url: ${{ vars.APP_URL }}

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      TAG: ${{ needs.docker.outputs.tag }}
      IMAGEM: ${{ needs.docker.outputs.imagem }}

    steps:
      - name: Checkout (arquivos de deploy)
        uses: actions/checkout@v4

      - name: Configurar SSH
        # ssh/scp nativos do runner, sem action de terceiros na cadeia de entrega (REQ-OPS-10).
        # SSH_KNOWN_HOSTS (saída de `ssh-keyscan <host>` conferida por uma pessoa) permite
        # verificar a chave do servidor; sem ela o deploy falha em vez de confiar em qualquer host.
        # A chave pública correspondente a SSH_PRIVATE_KEY precisa estar no authorized_keys do servidor.
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copiar compose e script de deploy
        run: |
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            docker-compose.prod.yml scripts/deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:/opt/ecoshop/"

      - name: Deploy (migra, sobe, verifica a saúde e reverte se falhar)
        # o .env com os segredos fica só no servidor (/opt/ecoshop/.env), fora do repositório
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/ecoshop && ECOSHOP_IMAGE='$IMAGEM' APP_TAG='$TAG' sh ./deploy.sh"
